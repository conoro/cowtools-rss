service: cowtools-rss

frameworkVersion: ">=3"

#plugins:
#  - serverless-secrets-plugin

provider:
  name: aws
  runtime: nodejs24.x
  stage: dev
  region: eu-west-1
functions:
  check:
    handler: handler.check
    description: generate RSS feed for Far Side comic strips
    # One scrape of thefarside.com; the 6s default is tight on a cold start.
    timeout: 15
    events:
      - http:
          path: rss
          method: get
          cors: true
          integration: lambda
          response:
            headers:
              Content-Type: "'text/xml'"
            template: $input.path('$')
