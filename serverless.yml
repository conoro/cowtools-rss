service: cowtools-rss

# v4 coerces this to a concrete version and compares major numbers only, so a range
# like ">=3" is read as 3.0.0 and rejected. Must start with the major you run.
frameworkVersion: "4"

#plugins:
#  - serverless-secrets-plugin

provider:
  name: aws
  runtime: nodejs24.x
  stage: dev
  region: eu-west-1
functions:
  check:
    handler: handler.check
    description: generate RSS feed for Far Side comic strips
    # One scrape of thefarside.com; the 6s default is tight on a cold start.
    timeout: 15
    events:
      - http:
          path: rss
          method: get
          cors: true
          integration: lambda
          response:
            headers:
              Content-Type: "'text/xml'"
            template: $input.path('$')
