name: Build feed

on:
  schedule:
    # Twice a day. The Far Side rolls over to the new day's strips somewhere around
    # midnight US time, so both runs sit well clear of that boundary.
    - cron: "0 9,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Two runs committing to docs/ at once would collide on push.
concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: node build.mjs

      - name: Commit the feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "Update feed"
          git push
